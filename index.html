<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>נחיתה על הירח</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#04060e;font-family:system-ui,-apple-system,sans-serif;color:#dfe6f5}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:520px;padding:12px 18px 2px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;font-weight:800}
#hud{font-size:12.5px;background:#0b1020;border:1px solid #26304f;padding:6px 10px;border-radius:14px;display:flex;gap:10px}
#msg{min-height:20px;font-size:14px;color:#ffd98a;margin:3px 0;text-align:center}
canvas{display:block;touch-action:none;border-radius:12px}
#pad{display:flex;gap:14px;padding:10px 0 14px;align-items:center}
#pad button{width:76px;height:54px;border-radius:14px;border:1px solid #26304f;background:#0b1020;color:#8fd3ff;font-size:22px;font-weight:800}
#pad .thrustB{width:120px;background:linear-gradient(135deg,#f59e0b,#dc2626);color:#fff;border:none}
#ov{position:fixed;inset:0;background:#03040acc;display:flex;align-items:center;justify-content:center;z-index:9}
.panel{background:linear-gradient(180deg,#0e1428,#080c1a);border:1px solid #26304f;border-radius:20px;padding:30px 26px;text-align:center;max-width:330px;width:88%}
.panel h2{font-size:26px;margin-bottom:8px}
.panel p{font-size:14px;line-height:1.7;color:#aab6d8;margin-bottom:14px}
.panel .big{font-size:15px;color:#ffd54a;font-weight:800;margin-bottom:16px}
button.go{padding:13px 26px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#8fd3ff,#3b82f6);color:#03102a}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>נחיתה על הירח</h1><div id="hud"><span id="fuel">דלק 100</span><span id="lvl">שלב 1</span></div></header>
<div id="msg">החזיקו מנוע להאט, חצים לסיבוב</div>
<canvas id="c"></canvas>
<div id="pad">
<button id="rotR">⟲</button>
<button class="thrustB" id="thrustB">מנוע</button>
<button id="rotL">⟳</button>
</div>
<div id="ov"><div class="panel">
<h2>נחיתה על הירח</h2>
<p>הנחיתו את החללית על המשטח הירוק — לאט, ישר ובזהירות. מהירות מעל 25 או זווית עקומה = התרסקות. 5 שלבים, הדלק מוגבל!</p>
<div class="big" id="best"></div>
<button class="go" id="startBtn">שיגור</button>
</div></div>
<script>
'use strict';
const cv=document.getElementById('c'),x=cv.getContext('2d');
const fuelEl=document.getElementById('fuel'),lvlEl=document.getElementById('lvl'),msg=document.getElementById('msg'),ov=document.getElementById('ov');
let W=0,H=0;
let lander,terrain,pads,level=1,fuel=100,state='fly',thrust=false,rot=0,stars=[];
const G=22,TH=58,MAXV=25;
function genTerrain(){
  terrain=[];
  const n=14;
  for(let i=0;i<=n;i++){
    const px=i/n*W;
    let py=H*(0.62+Math.random()*0.24);
    terrain.push({x:px,y:py});
  }
  // pads: 2 flat spots
  pads=[];
  const used=new Set();
  while(pads.length<2){
    const i=1+((Math.random()*(n-2))|0);
    if(used.has(i)||used.has(i-1)||used.has(i+1))continue;
    used.add(i);
    const w2=W*(0.10+Math.random()*0.03);
    terrain[i].x=Math.max(w2,Math.min(W-w2,terrain[i].x));
    pads.push({x1:terrain[i].x-w2/2,x2:terrain[i].x+w2/2,y:terrain[i].y});
  }
  for(const p of pads){
    for(const t of terrain){if(t.x>p.x1&&t.x<p.x2)t.y=p.y;}
  }
  stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*1.3+0.3});
}
function reset(){
  genTerrain();
  lander={x:W*0.5,y:H*0.12,vx:(Math.random()-0.5)*16,vy:0,a:0};
  fuel=100;state='fly';thrust=false;rot=0;
  fuelEl.textContent='דלק 100';lvlEl.textContent='שלב '+level;
  msg.textContent='החזיקו מנוע להאט, חצים לסיבוב';
}
function groundY(px){
  for(let i=0;i<terrain.length-1;i++){
    const a=terrain[i],b=terrain[i+1];
    if(px>=a.x&&px<=b.x)return a.y+(b.y-a.y)*(px-a.x)/(b.x-a.x||1);
  }
  return H;
}
function onPad(px){
  for(const p of pads)if(px>=p.x1+6&&px<=p.x2-6)return p;
  return null;
}
function step(dt){
  if(state!=='fly')return;
  lander.vy+=G*dt;
  lander.a+=rot*2.6*dt;
  lander.a*= (1-0.6*dt);
  if(thrust&&fuel>0){
    lander.vx+=Math.sin(lander.a)*TH*dt;
    lander.vy-=Math.cos(lander.a)*TH*dt;
    fuel=Math.max(0,fuel-30*dt);
    fuelEl.textContent='דלק '+Math.round(fuel);
  }
  lander.x+=lander.vx*dt;lander.y+=lander.vy*dt;
  if(lander.x<8){lander.x=8;lander.vx=Math.abs(lander.vx)*0.4;}
  if(lander.x>W-8){lander.x=W-8;lander.vx=-Math.abs(lander.vx)*0.4;}
  const gy=groundY(lander.x);
  if(lander.y>=gy-10){
    const speed=Math.hypot(lander.vx,lander.vy);
    const pad=onPad(lander.x);
    const upright=Math.abs(lander.a)<0.28;
    lander.y=gy-10;
    if(pad&&speed<MAXV&&upright){
      state='landed';
      const bonus=Math.round(fuel);
      msg.textContent=`נחיתה מושלמת! +${100+bonus} נקודות`;
      const sc=+(localStorage.getItem('lunarScore')||0)+100+bonus;
      localStorage.setItem('lunarScore',sc);
      if(level>=5){
        setTimeout(()=>{
          ov.querySelector('h2').textContent='משימה הושלמה!';
          ov.querySelector('p').textContent='חמש נחיתות מוצלחות. אתם טייסי חלל אלופים.';
          ov.querySelector('.big').textContent='ניקוד: '+sc;
          ov.querySelector('button').textContent='משחק חדש';
          ov.classList.remove('hidden');
          level=1;localStorage.setItem('lunarScore',0);
        },1200);
      }else{level++;setTimeout(reset,1600);}
    }else{
      state='crashed';
      msg.textContent=pad?(speed>=MAXV?'מהיר מדי! התרסקה':'זווית עקומה — התרסקה'):'פספסתם את המשטח!';
      setTimeout(()=>{
        ov.querySelector('h2').textContent='התרסקה';
        ov.querySelector('p').textContent='נסו שוב: האיטו מוקדם, יישרו את החללית וכוונו למשטח הירוק.';
        ov.querySelector('.big').textContent='הגעתם לשלב '+level;
        ov.querySelector('button').textContent='נסיון נוסף';
        ov.classList.remove('hidden');
      },1300);
    }
  }
}
function drawLander(){
  x.save();
  x.translate(lander.x,lander.y);
  x.rotate(lander.a);
  if(state==='crashed'){
    // explosion
    x.fillStyle='#f97316';
    for(let i=0;i<8;i++){const an=i/8*Math.PI*2;x.beginPath();x.arc(Math.cos(an)*12,Math.sin(an)*12,5,0,7);x.fill();}
    x.fillStyle='#fbbf24';x.beginPath();x.arc(0,0,9,0,7);x.fill();
    x.restore();return;
  }
  // flame
  if(thrust&&fuel>0&&state==='fly'){
    const f=10+Math.random()*8;
    x.fillStyle='#f97316';
    x.beginPath();x.moveTo(-4,10);x.lineTo(0,10+f);x.lineTo(4,10);x.closePath();x.fill();
    x.fillStyle='#fde68a';
    x.beginPath();x.moveTo(-2.5,10);x.lineTo(0,10+f*0.6);x.lineTo(2.5,10);x.closePath();x.fill();
  }
  // legs
  x.strokeStyle='#94a3b8';x.lineWidth=2.5;
  x.beginPath();x.moveTo(-7,4);x.lineTo(-11,12);x.lineTo(-14,12);x.stroke();
  x.beginPath();x.moveTo(7,4);x.lineTo(11,12);x.lineTo(14,12);x.stroke();
  // body
  const g=x.createLinearGradient(-8,0,8,0);
  g.addColorStop(0,'#cbd5e1');g.addColorStop(0.5,'#f1f5f9');g.addColorStop(1,'#94a3b8');
  x.fillStyle=g;
  x.beginPath();x.moveTo(0,-12);x.quadraticCurveTo(8,-6,8,6);x.lineTo(-8,6);x.quadraticCurveTo(-8,-6,0,-12);x.fill();
  x.strokeStyle='#475569';x.lineWidth=1.5;x.stroke();
  // window
  x.fillStyle='#38bdf8';x.beginPath();x.arc(0,-3,3.2,0,7);x.fill();
  x.strokeStyle='#0c4a6e';x.stroke();
  x.restore();
}
function draw(){
  x.clearRect(0,0,W,H);
  // stars
  x.fillStyle='#ffffff';
  for(const s of stars){x.globalAlpha=0.3+s.r*0.4;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();}
  x.globalAlpha=1;
  // moon
  x.fillStyle='#1c2333';
  x.beginPath();x.arc(W*0.82,H*0.14,26,0,7);x.fill();
  x.fillStyle='#242d42';
  x.beginPath();x.arc(W*0.79,H*0.12,7,0,7);x.fill();
  x.beginPath();x.arc(W*0.86,H*0.16,5,0,7);x.fill();
  // terrain
  x.fillStyle='#3b4356';
  x.beginPath();x.moveTo(0,H);
  for(const t of terrain)x.lineTo(t.x,t.y);
  x.lineTo(W,H);x.closePath();x.fill();
  x.strokeStyle='#59637a';x.lineWidth=2;
  x.beginPath();x.moveTo(terrain[0].x,terrain[0].y);
  for(const t of terrain)x.lineTo(t.x,t.y);
  x.stroke();
  // pads
  for(const p of pads){
    x.fillStyle='#22c55e';
    x.fillRect(p.x1,p.y-4,p.x2-p.x1,4);
    x.fillStyle='#22c55e55';
    x.fillRect(p.x1,p.y-14,p.x2-p.x1,10);
  }
  drawLander();
  // velocity indicator
  if(state==='fly'){
    const sp=Math.hypot(lander.vx,lander.vy);
    x.fillStyle=sp>MAXV?'#f87171':'#4ade80';
    x.font='700 12px system-ui';x.textAlign='right';
    x.fillText('מהירות '+Math.round(sp),W-10,22);
  }
}
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.033,(t-lastT)/1000||0.016);lastT=t;
  step(dt);draw();
}
const hold=(el,on,off)=>{
  el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
};
hold(document.getElementById('thrustB'),()=>thrust=true,()=>thrust=false);
hold(document.getElementById('rotR'),()=>rot=-1,()=>{if(rot<0)rot=0;});
hold(document.getElementById('rotL'),()=>rot=1,()=>{if(rot>0)rot=0;});
document.getElementById('startBtn').onclick=()=>{ov.classList.add('hidden');reset();};
function resize(){
  W=Math.min(window.innerWidth-16,500);H=Math.min(window.innerHeight-190,W*1.25);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  x.setTransform(dpr,0,0,dpr,0,0);x.direction='ltr';
  genTerrain();draw();
}
window.addEventListener('resize',resize);
reset();resize();requestAnimationFrame(loop);
</script>
</body>
</html>
